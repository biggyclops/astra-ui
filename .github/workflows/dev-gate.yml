name: Development Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Development Gate
        run: |
          chmod +x scripts/dev-gate.sh
          ./scripts/dev-gate.sh

      - name: Run Auth Gate Tests
        timeout-minutes: 5
        env:
          # Secret must be at least 32 characters (generate with: openssl rand -hex 32)
          ASTRA_AUTH_SECRET: ci-test-secret-not-real-minimum-32-chars
          ASTRA_AUTH_USER: ci-testuser
          ASTRA_AUTH_PASSWORD_SHA256: "13d249f2cb4127b40cfa757866850278793f814ded3c587fe5889e889a7a9f6c"
        run: npx tsx scripts/test-auth-gate.ts

      - name: Generate verification report
        if: always()
        run: |
          cat > verification-report.md << EOF
          # Development Gate Report

          **Branch:** ${{ github.head_ref }}
          **Commit:** ${{ github.sha }}
          **Status:** ${{ job.status }}

          ## Verification Results
          - TypeScript check: completed
          - Production build: completed
          - Working tree status: reported by gate

          Report generated by Astra Development Gate v1.
          EOF

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: verification-report.md
